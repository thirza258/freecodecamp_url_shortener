  <text x="100" y="350" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">Custom branded slugs • Real-time click tracking • Instant QR codes • &lt;5ms redirect</text>
  
  <!-- Stat boxes -->
